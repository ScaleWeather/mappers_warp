[package]
name = "mappers_warp"
version = "0.1.0-alpha.2"
edition = "2024"
publish = true
authors = ["Jakub Lewandowski <scaleweather@gmail.com>"]
description = "Very simplistic tool for reprojecting maps, based on GdalWarp"
repository = "https://github.com/ScaleWeather/mappers_warp"
readme = "README.md"
categories = ["mathematics", "science"]
license = "Apache-2.0"
exclude = [".github/*", "tests/data"]

[dependencies]
mappers = { version = "0.8", default-features = false }
ndarray = { version = "0.17", default-features = false, features = ["std"] }
thiserror = { version = "2.0", default-features = false }

rkyv = { version = "0.8", default-features = false, optional = true, features = [
    "std",
    "bytecheck",
] }

[dev-dependencies]
float-cmp = { version = "0.10" }
# something, something, dependecies something
netcdf = { version = "0.11", features = ["ndarray", "static"] }
anyhow = { version = "1.0" }
criterion = { version = "0.8" }

[features]
default = []
io = ["rkyv"]
multithreading = ["ndarray/rayon"]

[[bench]]
name = "warp"
harness = false

[package.metadata.docs.rs]
features = ["io", "multithreading"]
